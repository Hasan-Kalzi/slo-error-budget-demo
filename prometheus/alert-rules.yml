groups:
  - name: slo-error-budget
    interval: 2s
    rules:
      - record: demo:error_ratio:rate30s
        expr: |
          sum(rate(demo_http_requests_total{result="error"}[30s]))
          /
          clamp_min(sum(rate(demo_http_requests_total[30s])), 0.001)

      - record: demo:error_budget_burn_rate:rate30s
        expr: demo:error_ratio:rate30s / 0.01

      - alert: ErrorBudgetBurning
        expr: demo:error_budget_burn_rate:rate30s > 1
        for: 10s
        labels:
          severity: warning
          slo: "99_percent_availability"
        annotations:
          summary: "The service is consuming its error budget too quickly"
          description: "The 30-second error ratio exceeds the 1% error budget."