services:
  app:
    build:
      context: ./app
    ports:
      - "8000:8000"
    environment:
      INITIAL_FAILURE_RATE: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 2s
      retries: 10

  load-generator:
    build:
      context: ./load-generator
    environment:
      TARGET_URL: "http://app:8000/work"
      REQUEST_INTERVAL_SECONDS: "0.1"
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - app
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  tests:
    # Build the test runner from the files inside ./tests.
    build:
      context: ./tests

    # Tell the tests how to reach the application inside the Compose network.
    environment:
      APP_BASE_URL: "http://app:8000"

    # Do not start the tests until the application's healthcheck succeeds.
    depends_on:
      app:
        condition: service_healthy

    # Exclude tests from the normal demo startup.
    # The service runs only when the "test" profile is explicitly enabled.
    profiles:
      - test
